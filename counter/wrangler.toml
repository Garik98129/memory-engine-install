# The setup counter (the engine's docs/DESIGN_PHASE3.md §5a, «The counter»).
name = "memory-engine-counter"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Workers Logs are on for a new Worker and keep each request three days on the free plan; traces,
# off unless turned on, keep seven. Both off here, so no request is kept but as a count.
[observability]
enabled = false

[observability.traces]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "memory-engine-counter"
database_id = "d9664fde-8e3a-4303-b5d1-082ce387aad1"   # the id `wrangler d1 create memory-engine-counter` prints

[vars]
# The origin whose browsers may send a line: the setup page's own address, setup.grafyla.com — every
# page served there, which is this repository's alone (until 23.11.2026: https://garik98129.github.io,
# the owner's GitHub Pages, any page under it). It keeps other sites' pages out, not a script, which
# can set any Origin. A change here reaches the counter only with a deployment.
ALLOWED_ORIGIN = "https://setup.grafyla.com"

# STATS_KEY — a secret of at least 32 random characters (`wrangler secret put STATS_KEY`), never in
# this file: the owner's link to the numbers carries it.
