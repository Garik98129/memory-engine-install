# The counter's tests (counter/README.md, «Tests»): node:sqlite runs the same SQL as D1. Read-only: the
# job checks out the code and runs `npm test`, nothing else; the actions are pinned to full commits.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22.23.5   # the version the tests were last run on; node:sqlite needs 22
      - run: node --version
      - run: npm test
